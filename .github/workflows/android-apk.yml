name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (e.g. android-v1)"
        required: true
        default: "android-v1"
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Make a signing key (this build only)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass "ame-$GITHUB_RUN_ID" -keypass "ame-$GITHUB_RUN_ID" -alias ame -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Arabic Math Editor"
      - name: Build
        env:
          KS_FILE: ${{ runner.temp }}/release.jks
        run: |
          export KS_PASS="ame-$GITHUB_RUN_ID"
          gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk ArabicMathEditor.apk
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" --title "Android ${{ inputs.tag }}" --notes "Arabic Math Editor for Android (installs the web app full screen)" --prerelease --latest=false
          gh release upload "${{ inputs.tag }}" ArabicMathEditor.apk --clobber
