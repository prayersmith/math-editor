name: Build whiteboard Android app
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to"
        required: true
        default: "board-app-v1"
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Web files
        run: |
          mkdir -p build/www/board && cd build
          cp ../index.html www/index.html
          cp -r ../fonts ../mfonts ../pdfjs ../ocr www/
          cp ../fonts.css ../custom-fonts.css ../icon-192.png ../icon-512.png ../icon-maskable-512.png www/
          cp ../board/index.html ../board/icon-192.png ../board/icon-512.png www/board/
          cp ../android-standalone/cap-shim.js www/cap-shim.js
          cp ../android-standalone/board-upd.js www/upd.js
          cp ../android-standalone/board-upd-check.js www/upd-check.js
          python3 - <<'PY'
          import hashlib, json
          # fingerprints of the copies built into the app, so the updater only downloads real changes
          json.dump({'board': hashlib.sha256(open('../board/index.html','rb').read()).hexdigest(),
                     'editor': hashlib.sha256(open('../index.html','rb').read()).hexdigest()}, open('www/upd-base.json','w'))
          # editor: open the board on launch; the editor itself is used inside the board
          p='www/index.html'; s=open(p,encoding='utf-8').read()
          boot='<script>if(window===top&&!/[?&]board=/.test(location.search)&&!sessionStorage.getItem("boardBoot")){sessionStorage.setItem("boardBoot","1");window.__booting=1;location.replace("board/index.html");}</script><script src="upd.js"></script><script src="cap-shim.js"></script>'
          i=s.index('<head>')+6; s=s[:i]+boot+s[i:]
          open(p,'w',encoding='utf-8').write(s)
          p='www/board/index.html'; s=open(p,encoding='utf-8').read()
          i=s.index('<head>')+6; s=s[:i]+'<script src="../upd.js"></script><script src="../cap-shim.js"></script>'+s[i:]
          open(p,'w',encoding='utf-8').write(s)
          PY
          du -sh www
      - name: Capacitor project
        working-directory: build
        run: |
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          cat > capacitor.config.json <<'JSON'
          {"appId":"io.github.prayersmith.arabicmath.board","appName":"السبورة الرياضية","webDir":"www","server":{"androidScheme":"https"},"android":{"allowMixedContent":false}}
          JSON
          npx cap add android
          npx cap sync android
          sudo apt-get install -y -qq imagemagick >/dev/null
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26 $R/drawable-v24/ic_launcher_foreground.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}; mkdir -p $R/mipmap-$n
            convert www/board/icon-512.png -resize ${s}x${s} $R/mipmap-$n/ic_launcher.png
            cp $R/mipmap-$n/ic_launcher.png $R/mipmap-$n/ic_launcher_round.png
            rm -f $R/mipmap-$n/ic_launcher_foreground.png
          done
      - name: Build
        working-directory: build/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Sign
        env:
          KS_B64: ${{ secrets.ANDROID_KS_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/r.jks; PW="$KS_PASS"; echo "fixed signing key"
          else
            PW="amb-$GITHUB_RUN_ID"; keytool -genkeypair -keystore $RUNNER_TEMP/r.jks -storepass "$PW" -keypass "$PW" -alias ame -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Arabic Math Board"
          fi
          U=$(ls build/android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$U" aligned.apk
          $BT/apksigner sign --ks $RUNNER_TEMP/r.jks --ks-pass "pass:$PW" --key-pass "pass:$PW" --out ArabicMathBoard.apk aligned.apk
          $BT/apksigner verify ArabicMathBoard.apk && ls -la ArabicMathBoard.apk
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" --title "السبورة الرياضية — تطبيق أندرويد ${{ inputs.tag }}" --notes "تطبيق السبورة الرياضية العربية لأندرويد (يعمل دون إنترنت، ويتضمن المحرر العربي)" --prerelease --latest=false
          gh release delete-asset "${{ inputs.tag }}" ArabicMathBoard.apk --yes || true
          sleep 3
          gh release upload "${{ inputs.tag }}" ArabicMathBoard.apk --clobber
